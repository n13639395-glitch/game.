name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install python-for-android cython==0.29.33

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package org.mygame \
            --name "My Game" \
            --version 1.0 \
            --bootstrap sdl2 \
            --requirements=python3,kivy \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --permission INTERNET

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Game-APK
          path: "**/*.apk"
